# --- Single control loop: all behaviour dispatched by trigger id.
  #     Now also carries the 30s keep-alive (renew) that used to be its
  #     own automation. ---
  - id: alfen_control
    alias: Alfen control
    mode: queued
    max: 10
    trace:
      stored_traces: 100
    triggers:
      - trigger: time_pattern
        seconds: "/20"
        id: tick
      - trigger: time_pattern
        seconds: "/30"
        id: renew
      - trigger: state
        entity_id: input_select.alfen_charge_mode
        id: mode_change
      - trigger: state
        entity_id: sensor.alfen_mode3
        id: mode_change
      - trigger: state
        entity_id: input_number.alfen_target_current
        id: manual_slider
      - trigger: template
        value_template: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             >= states('input_number.alfen_min_current') | float(6) * 230 }}
        for: "00:03:00"
        id: solar_start
      - trigger: template
        value_template: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             < states('input_number.alfen_min_current') | float(6) * 230 }}
        for: "00:03:00"
        id: solar_stop
      - trigger: template
        value_template: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             >= 3 * states('input_number.alfen_min_current') | float(6) * 230 }}
        for: "00:03:00"
        id: phase_up
      - trigger: template
        value_template: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             < 3 * states('input_number.alfen_min_current') | float(6) * 230 * 0.9 }}
        for: "00:03:00"
        id: phase_down
    actions:
      - choose:
          # ===== Keep-alive: re-push target every 30s while a car is connected =====
          - conditions:
              - condition: trigger
                id: renew
              - condition: template
                value_template: >
                  {{ states('sensor.alfen_mode3')
                     not in ['A','E','F','unknown','unavailable',''] }}
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_target_current') | float(0) }}"

          # ===== Mode / car-state change: Off|disconnect -> pause (+clear lockout); Fast -> 3p max =====
          - conditions:
              - condition: trigger
                id: mode_change
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >
                          {{ is_state('input_select.alfen_charge_mode','Off')
                             or states('sensor.alfen_mode3')
                                in ['A','E','F','unknown','unavailable',''] }}
                    sequence:
                      - service: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.alfen_protect_lockout
                      - service: script.alfen_set_current
                        data:
                          amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"
                  - conditions:
                      - condition: state
                        entity_id: input_select.alfen_charge_mode
                        state: "Fast"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states('sensor.alfen_phases') | int(1) != 3 }}"
                        then:
                          - service: script.alfen_switch_phases
                            data:
                              phases: 3
                      - service: script.alfen_set_current
                        data:
                          amps: >
                            {{ [ states('input_number.alfen_max_current') | float(20),
                                 states('input_number.alfen_phase_limit') | float(16),
                                 states('sensor.alfen_headroom_active') | float(99) ] | min }}
                default: []

          # ===== Manual slider write-through =====
          - conditions:
              - condition: trigger
                id: manual_slider
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Manual"
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_target_current') | float(0) }}"

          # ===== Solar start (kickstart to min; blocked while locked out) =====
          - conditions:
              - condition: trigger
                id: solar_start
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: state
                entity_id: input_boolean.alfen_protect_lockout
                state: "off"
              - condition: template
                value_template: >
                  {{ states('sensor.alfen_mode3')
                     not in ['A','E','F','unknown','unavailable',''] }}
              - condition: template
                value_template: >
                  {{ states('input_number.alfen_target_current') | float(0)
                     < states('input_number.alfen_min_current') | float(6) }}
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_min_current') | float(6) }}"

          # ===== Solar stop =====
          - conditions:
              - condition: trigger
                id: solar_stop
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: template
                value_template: >
                  {{ states('input_number.alfen_target_current') | float(0)
                     >= states('input_number.alfen_min_current') | float(6) }}
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"

          # ===== Solar modulate (20s tick, surplus feedback + fuse cutout) =====
          - conditions:
              - condition: trigger
                id: tick
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: template
                value_template: >
                  {{ states('sensor.alfen_mode3')
                     not in ['A','E','F','unknown','unavailable',''] }}
              - condition: template
                value_template: >
                  {{ states('input_number.alfen_target_current') | float(0)
                     >= states('input_number.alfen_min_current') | float(6) }}
            sequence:
              - variables:
                  minc: "{{ states('input_number.alfen_min_current') | float(6) }}"
                  head: "{{ states('sensor.alfen_headroom_active') | float(99) }}"
                  newt: >
                    {% set surplus = states('sensor.alfen_solar_surplus') | float(0) %}
                    {% set ph = states('sensor.alfen_phases') | int(1) %}
                    {% set ph = ph if ph in [1,3] else 1 %}
                    {% set v = 230 %}
                    {% set minc = states('input_number.alfen_min_current') | float(6) %}
                    {% set maxc = states('input_number.alfen_max_current') | float(20) %}
                    {% set plim = states('input_number.alfen_phase_limit') | float(16) %}
                    {% set head = states('sensor.alfen_headroom_active') | float(99) %}
                    {% set raw = surplus / (ph * v) %}
                    {% set capped = [ raw, maxc, plim, head ] | min %}
                    {{ ([ capped, minc ] | max) | round(0) }}
              - choose:
                  # Headroom below the charge floor -> latch lockout + stop.
                  - conditions:
                      - condition: template
                        value_template: "{{ head | float < minc | float }}"
                    sequence:
                      - service: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.alfen_protect_lockout
                      - service: script.alfen_set_current
                        data:
                          amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"
                default:
                  - condition: template
                    value_template: >
                      {{ (newt | float - states('input_number.alfen_target_current') | float(0))
                         | abs >= 1 }}
                  - service: script.alfen_set_current
                    data:
                      amps: "{{ newt }}"

          # ===== Phase up 1 -> 3 (gated by cooldown) =====
          - conditions:
              - condition: trigger
                id: phase_up
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: template
                value_template: "{{ states('sensor.alfen_phases') | int(1) == 1 }}"
              - condition: template
                value_template: >
                  {{ states('input_number.alfen_target_current') | float(0)
                     >= states('input_number.alfen_min_current') | float(6) }}
              - condition: template
                value_template: >
                  {% set last = states('input_datetime.alfen_last_phase_switch') %}
                  {% set cd = states('input_number.alfen_phase_cooldown') | float(10) * 60 %}
                  {{ true if last in ['unknown','unavailable']
                     else (now() - as_datetime(last)).total_seconds() > cd }}
            sequence:
              - service: script.alfen_switch_phases
                data:
                  phases: 3

          # ===== Phase down 3 -> 1 (gated by cooldown; only if L1 can hold 1-phase) =====
          - conditions:
              - condition: trigger
                id: phase_down
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: template
                value_template: "{{ states('sensor.alfen_phases') | int(1) == 3 }}"
              - condition: template
                value_template: >
                  {% set v = 230 %}
                  {% set fuse = states('input_number.alfen_fuse_per_phase') | float(25) %}
                  {% set minc = states('input_number.alfen_min_current') | float(6) %}
                  {% set ph = states('sensor.alfen_phases') | int(3) %}
                  {% set amps = states('input_number.alfen_target_current') | float(0) %}
                  {% set car_l1_now = (amps / 3) if ph == 3 else amps %}
                  {% set house_l1 = (states('sensor.p1_meter_power_phase_1') | float(0)) / v - car_l1_now %}
                  {{ (house_l1 + minc) <= fuse }}
              - condition: template
                value_template: >
                  {% set last = states('input_datetime.alfen_last_phase_switch') %}
                  {% set cd = states('input_number.alfen_phase_cooldown') | float(10) * 60 %}
                  {{ true if last in ['unknown','unavailable']
                     else (now() - as_datetime(last)).total_seconds() > cd }}
            sequence:
              - service: script.alfen_switch_phases
                data:
                  phases: 1
        default: []