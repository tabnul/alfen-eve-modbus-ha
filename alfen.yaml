# packages/alfen.yaml — generic control engine. No site-specific price wiring.
# Modes: Off / Solar / Fast. Solar always starts 1-phase and switches up only on
# sustained 3-phase surplus. Both the fuse guard and the Solar modulate loop use an
# ASYMMETRIC deadband: writing a LOWER current makes the car re-negotiate (IEC 61851),
# writing a HIGHER one does not, so down-writes are buffered and up-writes are not.

input_number:
  alfen_target_current:
    name: Alfen target current
    min: 0
    max: 32
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_min_current:
    name: Alfen min current
    min: 6
    max: 16
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_max_current:
    name: Alfen max current
    min: 6
    max: 32
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_stop_current:
    name: Alfen stop current
    min: 0
    max: 6
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_fuse_per_phase:
    name: Alfen fuse per phase
    min: 6
    max: 80
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_phase_up_threshold:
    name: Alfen phase up threshold
    min: 4140
    max: 11000
    step: 100
    mode: box
    unit_of_measurement: W
  alfen_phase_down_threshold:
    name: Alfen phase down threshold
    min: 2000
    max: 6000
    step: 100
    mode: box
    unit_of_measurement: W
  alfen_phase_cooldown:
    name: Alfen phase cooldown
    min: 0
    max: 60
    step: 1
    mode: box
    unit_of_measurement: min
  alfen_solar_hold:
    name: Alfen solar start/stop hold
    min: 0
    max: 15
    step: 1
    mode: box
    unit_of_measurement: min
  alfen_phase_hold:
    name: Alfen phase switch hold
    min: 0
    max: 15
    step: 1
    mode: box
    unit_of_measurement: min
  alfen_stop_cooldown:
    name: Alfen post-stop recovery cooldown
    min: 0
    max: 15
    step: 1
    mode: box
    unit_of_measurement: min
  alfen_step_down_buffer:
    name: Alfen step-down buffer
    min: 1
    max: 5
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_step_up_buffer:
    name: Alfen step-up buffer
    min: 1
    max: 5
    step: 1
    mode: box
    unit_of_measurement: A
  # Solar-only down-step deadband. Separate from the fuse-guard buffer because
  # that one is a SAFETY buffer (kept small, 1 A) while this one is purely an
  # anti-churn buffer for cloud-driven surplus wobble (can be larger).
  alfen_solar_step_down_buffer:
    name: Alfen solar step-down buffer
    min: 1
    max: 6
    step: 1
    mode: box
    unit_of_measurement: A
  # Solar-only: how long the sun must stay lower before Solar lowers the
  # current. Filters out short clouds. Measured from a binary sensor, so the
  # timer only restarts when the condition itself flips.
  alfen_solar_down_settle:
    name: Alfen solar slow-down wait
    min: 0
    max: 300
    step: 5
    mode: box
    unit_of_measurement: s
  alfen_critical_timeout:
    name: Alfen sustained overload timeout
    min: 20
    max: 300
    step: 10
    mode: box
    unit_of_measurement: s
  alfen_guard_down_settle:
    name: Alfen scale-down settle time
    min: 0
    max: 120
    step: 5
    mode: box
    unit_of_measurement: s
  alfen_guard_up_settle:
    name: Alfen scale-up settle time
    min: 0
    max: 300
    step: 5
    mode: box
    unit_of_measurement: s

input_datetime:
  alfen_last_phase_switch:
    name: Alfen last phase switch
    has_date: true
    has_time: true
  alfen_last_guard_stop:
    name: Alfen last fuse-guard stop
    has_date: true
    has_time: true

input_select:
  alfen_charge_mode:
    name: Alfen charge mode
    options:
      - "Off"
      - "Solar"
      - "Fast"
  alfen_price_fallback:
    name: Alfen price fallback
    options:
      - "Off"
      - "Solar"
  # How many phases Solar may use. Auto switches between 1 and 3 on the
  # surplus thresholds; the fixed choices never switch. Anything else (e.g. the
  # helper not restored yet on first start) is treated as Auto.
  alfen_solar_phases:
    name: Alfen solar phases
    options:
      - "Auto"
      - "1-phase only"
      - "3-phase only"

input_boolean:
  alfen_dashboard_show_help:
    name: Show EV Charger Help
    icon: mdi:help-circle-outline
  # Solar option: never pause for lack of sun. Charges at minimum current
  # (6 A) as a floor and adds any surplus on top. Fewer stops/starts, at the
  # cost of some grid import when the sun is weak.
  alfen_solar_keep_min:
    name: "Solar: keep charging at minimum"
    icon: mdi:weather-partly-cloudy
  # Logbook anchor ONLY. Never toggled by anything. Every logbook.log call in
  # this package attaches its entry to this entity, so the dashboard's logbook
  # card can show exactly the engine's safety events and nothing else -- routine
  # state changes on alfen_target_current never land here.
  alfen_events:
    name: Alfen events
    icon: mdi:shield-car

# Which smart-meter sensors to use. Filled with the HomeWizard P1 names on
# first start (see alfen_charge_mode_apply); change them on the dashboard if
# yours differ -- Home Assistant keeps your values across restarts. The logic
# only uses what is in these fields: until all four point at working sensors,
# binary_sensor.alfen_meter_ok stays off and the car is held at minimum
# current. Each sensor must report power in W, import positive, export
# negative (the HomeWizard P1 convention).
input_text:
  alfen_meter_total:
    name: Alfen meter – total power
    max: 255
  alfen_meter_l1:
    name: Alfen meter – L1 power
    max: 255
  alfen_meter_l2:
    name: Alfen meter – L2 power
    max: 255
  alfen_meter_l3:
    name: Alfen meter – L3 power
    max: 255

template:
  - binary_sensor:
      # True when all four meter sensors are filled in and available as numbers
      # in W. Off on a fresh install until they're set up. When it
      # has been off for 30 s, the fuse guard holds the car at minimum current
      # (it can't protect the fuse without meter data) and Solar pauses its own
      # decisions. The 30 s ignores short meter hiccups and the meter still
      # loading right after a Home Assistant restart.
      - name: alfen_meter_ok
        unique_id: alfen_meter_ok
        state: >
          {{ is_number(states('sensor.alfen_grid_power'))
             and is_number(states('sensor.alfen_grid_l1'))
             and is_number(states('sensor.alfen_grid_l2'))
             and is_number(states('sensor.alfen_grid_l3')) }}

      # Surplus threshold flags. last_changed lets the control loop measure how long
      # a condition has held (level-triggered, no missed edges).
      # Start threshold = minimum current on the phases Solar will start on:
      # ~1.4 kW on one phase, ~4.1 kW when "3-phase only" is chosen.
      - name: alfen_surplus_over_start
        unique_id: alfen_surplus_over_start
        state: >
          {% set n = 3 if is_state('input_select.alfen_solar_phases','3-phase only') else 1 %}
          {{ states('sensor.alfen_solar_surplus') | float(0)
             >= states('input_number.alfen_min_current') | float(6) * 230 * n }}
      - name: alfen_surplus_over_up
        unique_id: alfen_surplus_over_up
        state: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             >= states('input_number.alfen_phase_up_threshold') | float(4800) }}
      - name: alfen_surplus_under_down
        unique_id: alfen_surplus_under_down
        state: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             < states('input_number.alfen_phase_down_threshold') | float(4140) }}
      - name: alfen_headroom_critical
        unique_id: alfen_headroom_critical
        state: >
          {{ states('sensor.alfen_headroom_active') | float(99)
             < states('input_number.alfen_min_current') | float(6) }}
      - name: alfen_guard_should_trim
        unique_id: alfen_guard_should_trim
        state: >
          {% set head = states('sensor.alfen_headroom_active') | float(99) %}
          {% set cur = states('input_number.alfen_target_current') | float(0) %}
          {% set buf = states('input_number.alfen_step_down_buffer') | float(1) %}
          {{ head < (cur - buf) and cur >= states('input_number.alfen_min_current') | float(6) }}
      # Solar: has the sun dropped far enough below what we're charging at to
      # justify lowering the current? Its last_changed times the Solar
      # slow-down wait. Sun only -- fuse-driven lowering is the guard's job.
      - name: alfen_solar_should_lower
        unique_id: alfen_solar_should_lower
        state: >
          {% set cur = states('input_number.alfen_target_current') | float(0) %}
          {% set t = states('sensor.alfen_solar_target') | float(0) %}
          {% set buf = states('input_number.alfen_solar_step_down_buffer') | float(2) %}
          {{ cur >= states('input_number.alfen_min_current') | float(6)
             and (cur - t) >= buf }}
      - name: alfen_guard_can_recover
        unique_id: alfen_guard_can_recover
        state: >
          {% set head = states('sensor.alfen_headroom_active') | float(0) %}
          {% set cur = states('input_number.alfen_target_current') | float(0) %}
          {% set maxc = states('input_number.alfen_max_current') | float(16) %}
          {% set buf = states('input_number.alfen_step_up_buffer') | float(2) %}
          {{ head >= (cur + buf) and cur < maxc }}

  - sensor:
      # Cleaned Mode 3 (IEC 61851) state. The charger returns the state as a
      # 10-byte string register (1201-1205): 'A' arrives as 'A' plus 9 padding
      # bytes, so the raw sensor NEVER equals 'A'. Every automation must read
      # THIS sensor, never sensor.alfen_mode3_state -- comparing the raw value
      # silently turns every "is a car connected?" check into always-true.
      # Becomes unavailable (not a string) when the raw read fails.
      - name: alfen_mode3
        unique_id: alfen_mode3
        icon: mdi:ev-plug-type2
        availability: >
          {{ states('sensor.alfen_mode3_state') not in ['unknown','unavailable'] }}
        state: >
          {{ states('sensor.alfen_mode3_state') | upper | regex_replace('[^A-Z0-9]', '') }}

      # Human-readable Mode 3 label for the dashboard. Display only.
      - name: alfen_mode3_text
        unique_id: alfen_mode3_text
        icon: mdi:ev-station
        state: >
          {% set s = states('sensor.alfen_mode3') %}
          {% set m = {
            'A':  'No vehicle connected',
            'B':  'Vehicle connected',
            'B1': 'Vehicle connected',
            'B2': 'Vehicle connected, ready',
            'C':  'Charging',
            'C1': 'Connected, not charging',
            'C2': 'Charging',
            'D':  'Charging (ventilation)',
            'D1': 'Charging (ventilation)',
            'D2': 'Charging (ventilation)',
            'E':  'Error / no supply',
            'F':  'Charge point unavailable'
          } %}
          {{ m.get(s, s ~ ' (unmapped)') }}

      # Grid power as reported by the configured meter entities (see
      # input_text.alfen_meter_*). Everything else reads these, never the meter
      # directly. Unavailable unless a sensor is filled in, exists, reports a
      # number, and is in W. No fallback name: an empty field means no meter.
      - name: alfen_grid_power
        unique_id: alfen_grid_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {% set e = states('input_text.alfen_meter_total') | trim %}
          {{ e.startswith('sensor.') and is_number(states(e))
             and state_attr(e, 'unit_of_measurement') == 'W' }}
        state: >
          {% set e = states('input_text.alfen_meter_total') | trim %}
          {{ states(e) | float(0) }}
      - name: alfen_grid_l1
        unique_id: alfen_grid_l1
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {% set e = states('input_text.alfen_meter_l1') | trim %}
          {{ e.startswith('sensor.') and is_number(states(e))
             and state_attr(e, 'unit_of_measurement') == 'W' }}
        state: >
          {% set e = states('input_text.alfen_meter_l1') | trim %}
          {{ states(e) | float(0) }}
      - name: alfen_grid_l2
        unique_id: alfen_grid_l2
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {% set e = states('input_text.alfen_meter_l2') | trim %}
          {{ e.startswith('sensor.') and is_number(states(e))
             and state_attr(e, 'unit_of_measurement') == 'W' }}
        state: >
          {% set e = states('input_text.alfen_meter_l2') | trim %}
          {{ states(e) | float(0) }}
      - name: alfen_grid_l3
        unique_id: alfen_grid_l3
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        availability: >
          {% set e = states('input_text.alfen_meter_l3') | trim %}
          {{ e.startswith('sensor.') and is_number(states(e))
             and state_attr(e, 'unit_of_measurement') == 'W' }}
        state: >
          {% set e = states('input_text.alfen_meter_l3') | trim %}
          {{ states(e) | float(0) }}

      - name: alfen_solar_surplus
        unique_id: alfen_solar_surplus
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.alfen_power_sum') | float(0))
             - (states('sensor.alfen_grid_power') | float(0)) }}

      # What the sun alone would support, per phase, on the current phase count:
      # surplus / (phases x 230), between min and max current. Deliberately NOT
      # limited by fuse headroom -- the fuse guard handles that in every mode.
      - name: alfen_solar_target
        unique_id: alfen_solar_target
        unit_of_measurement: A
        icon: mdi:solar-power-variant
        state: >
          {% set ph = states('sensor.alfen_phases') | int(1) %}
          {% set ph = ph if ph in [1,3] else 1 %}
          {% set minc = states('input_number.alfen_min_current') | float(6) %}
          {% set maxc = states('input_number.alfen_max_current') | float(16) %}
          {% set raw = (states('sensor.alfen_solar_surplus') | float(0)) / (ph * 230) %}
          {{ ([ [ raw, maxc ] | min, minc ] | max) | round(0) }}

      - name: alfen_headroom_l1
        unique_id: alfen_headroom_l1
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set v = 230 %}
          {% set fuse = states('input_number.alfen_fuse_per_phase') | float(25) %}
          {% set car = states('sensor.alfen_current_l1') | float(0) %}
          {% set house = (states('sensor.alfen_grid_l1') | float(0)) / v - car %}
          {#- Clamp at the fuse rating. While exporting, net phase power is
              negative, so 'house' goes negative and headroom would read well
              well above the cap. That credit is real only
              while the sun holds, and the car's own draw must fit the fuse on
              its own. -#}
          {{ ([ fuse - house, fuse ] | min) | round(1) }}
      - name: alfen_headroom_l2
        unique_id: alfen_headroom_l2
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set v = 230 %}
          {% set fuse = states('input_number.alfen_fuse_per_phase') | float(25) %}
          {% set car = states('sensor.alfen_current_l2') | float(0) %}
          {% set house = (states('sensor.alfen_grid_l2') | float(0)) / v - car %}
          {#- Clamp at the fuse rating. While exporting, net phase power is
              negative, so 'house' goes negative and headroom would read well
              well above the cap. That credit is real only
              while the sun holds, and the car's own draw must fit the fuse on
              its own. -#}
          {{ ([ fuse - house, fuse ] | min) | round(1) }}
      - name: alfen_headroom_l3
        unique_id: alfen_headroom_l3
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set v = 230 %}
          {% set fuse = states('input_number.alfen_fuse_per_phase') | float(25) %}
          {% set car = states('sensor.alfen_current_l3') | float(0) %}
          {% set house = (states('sensor.alfen_grid_l3') | float(0)) / v - car %}
          {#- Clamp at the fuse rating. While exporting, net phase power is
              negative, so 'house' goes negative and headroom would read well
              well above the cap. That credit is real only
              while the sun holds, and the car's own draw must fit the fuse on
              its own. -#}
          {{ ([ fuse - house, fuse ] | min) | round(1) }}

      - name: alfen_headroom_active
        unique_id: alfen_headroom_active
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set l1 = states('sensor.alfen_headroom_l1') | float(99) %}
          {% set l2 = states('sensor.alfen_headroom_l2') | float(99) %}
          {% set l3 = states('sensor.alfen_headroom_l3') | float(99) %}
          {% set ph = states('sensor.alfen_phases') | int(1) %}
          {% if ph == 3 %}
          {{ [ l1, l2, l3 ] | min | round(1) }}
          {% else %}
          {{ l1 | round(1) }}
          {% endif %}

      # Total AC energy consumed by charging, in kWh (for display + Energy dashboard).
      # (energy_consumed_sum is not populated on some meters; this is derived from the
      #  charger's delivered-energy register, which is the AC energy fed to the car.)
      - name: alfen_energy_consumed_total_kwh
        unique_id: alfen_energy_consumed_total_kwh
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ states('sensor.alfen_energy_delivered_sum') not in ['unknown','unavailable'] }}
        state: >
          {{ (states('sensor.alfen_energy_delivered_sum') | float(0) / 1000) | round(3) }}

script:
  # THE single write path for the charge current. Every automation and script
  # goes through here, so these protections apply to all of them at once:
  #  - mode: queued -> writes that arrive at the same moment are done one after
  #    the other, in order. None is silently dropped.
  #  - no amps given -> resend the current value, read at the moment of writing
  #    (used by the keep-alive), so it can never write back a value that another
  #    write has just replaced.
  #  - while a phase switch runs, only the switch itself may write. Checked here,
  #    at write time, not only when an automation starts.
  alfen_set_current:
    mode: queued
    max: 20
    fields:
      amps:
        description: Target current in amps. Leave out to resend the current value.
      during_switch:
        description: Only set by alfen_switch_phases.
    sequence:
      - condition: template
        value_template: >
          {{ (during_switch | default(false))
             or is_state('script.alfen_switch_phases', 'off') }}
      - variables:
          value: >
            {{ (amps if amps is defined
                else states('input_number.alfen_target_current')) | float(0) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.alfen_target_current
        data:
          value: "{{ value | float(0) }}"
      - variables:
          words: >
            {% set v = value | float(0) %}
            {% if v <= 0 %}
            {{ [0, 0] }}
            {% else %}
            {% set ns = namespace(v=v, e=0) %}
            {% for _ in range(64) %}
            {% if ns.v >= 2 %}{% set ns.v = ns.v / 2 %}{% set ns.e = ns.e + 1 %}
            {% elif ns.v < 1 %}{% set ns.v = ns.v * 2 %}{% set ns.e = ns.e - 1 %}
            {% endif %}
            {% endfor %}
            {% set E = ns.e + 127 %}
            {% set M = ((ns.v - 1) * 8388608) | round | int %}
            {% set bits = E * 8388608 + M %}
            {{ [ bits // 65536, bits % 65536 ] }}
            {% endif %}
      - service: modbus.write_register
        data:
          hub: alfen
          slave: 1
          address: 1210
          value: "{{ words }}"

  # Raw phase write. Same protections as alfen_set_current: queued, and refused
  # while a phase switch runs unless the switch itself calls it.
  alfen_set_phases:
    mode: queued
    max: 5
    fields:
      phases:
        description: 1 or 3
      during_switch:
        description: Only set by alfen_switch_phases.
    sequence:
      - condition: template
        value_template: >
          {{ (during_switch | default(false))
             or is_state('script.alfen_switch_phases', 'off') }}
      - service: modbus.write_register
        data:
          hub: alfen
          slave: 1
          address: 1215
          value: "{{ phases | int }}"

  alfen_switch_phases:
    fields:
      phases:
        description: 1 or 3
    mode: single
    sequence:
      # Logged here rather than at the call sites so manual dashboard button
      # presses are captured too. Every switch costs ~15 s of charging.
      - service: logbook.log
        data:
          name: Alfen phases
          entity_id: input_boolean.alfen_events
          message: >-
            Switch {{ states('sensor.alfen_phases') }} → {{ phases }}-phase
            (surplus {{ states('sensor.alfen_solar_surplus') | float(0) | round(0) | int }} W).
            Pause, switch, resume at minimum — ~15 s charging gap.
      - service: script.alfen_set_current
        data:
          amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"
          during_switch: true
      - delay: "00:00:10"
      - service: script.alfen_set_phases
        data:
          phases: "{{ phases }}"
          during_switch: true
      - delay: "00:00:05"
      - service: script.alfen_set_current
        data:
          amps: "{{ states('input_number.alfen_min_current') | float(6) }}"
          during_switch: true
      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.alfen_last_phase_switch
        data:
          timestamp: "{{ now().timestamp() }}"

automation:
  # --- Keep-alive: refresh 1210 every 30s while a car is connected ---
  - id: alfen_setpoint_renew
    alias: Alfen setpoint auto-renew
    mode: restart
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: template
        value_template: >
          {{ states('sensor.alfen_mode3')
             not in ['A','E','F','unknown','unavailable'] }}
    actions:
      # No amps: the script re-reads the current value at the moment it writes,
      # so this can never put back a value another write has just replaced.
      - service: script.alfen_set_current

  # --- Fuse guard, every 20 s, all modes: keeps every phase under the fuse by
  #     ADJUSTING the current rather than cutting it. The only thing that lowers
  #     or stops charging for the fuse, in every mode. Rides short overloads out
  #     at the 6 A floor; stops only after the sustained-overload timeout. In
  #     Fast it also raises the current again once there's room. 20 s suits a
  #     P1 meter that updates about every 10 s. ---
  - id: alfen_fuse_guard
    alias: Alfen fuse guard
    mode: restart
    triggers:
      - trigger: time_pattern
        seconds: "/20"
    conditions:
      - condition: template
        value_template: >
          {{ states('sensor.alfen_mode3')
             not in ['A','E','F','unknown','unavailable'] }}
      - condition: template
        value_template: >
          {{ states('sensor.alfen_headroom_active') not in ['unknown','unavailable'] }}
      # NEVER write current while a phase switch is running. The switch script
      # deliberately drops the setpoint to stop_current and holds it there for
      # 10 s so the contactor changes under no load. Without this condition the
      # guard sees that low setpoint, decides headroom has recovered, and writes
      # max current straight back into the middle of the pause -- the phase
      # register then gets written while the car is drawing full current and the
      # charger silently refuses to switch.
      - condition: state
        entity_id: script.alfen_switch_phases
        state: "off"
    actions:
      - variables:
          minc: "{{ states('input_number.alfen_min_current') | float(6) }}"
          maxc: "{{ states('input_number.alfen_max_current') | float(16) }}"
          head: "{{ states('sensor.alfen_headroom_active') | float(99) }}"
          cur: "{{ states('input_number.alfen_target_current') | float(0) }}"
          charging: "{{ cur | float >= minc | float }}"
          # Meter data usable? Without it the headroom is meaningless.
          meter_ok: "{{ is_state('binary_sensor.alfen_meter_ok', 'on') }}"
          meter_missing: >
            {{ not is_state('binary_sensor.alfen_meter_ok', 'on')
               and (as_timestamp(now()) - as_timestamp(states.binary_sensor.alfen_meter_ok.last_changed))
                   >= 30 }}
          mode: "{{ states('input_select.alfen_charge_mode') }}"
          # Is headroom critically low AND sustained? Real overload, not a cloud.
          critical_sustained: >
            {{ is_state('binary_sensor.alfen_headroom_critical','on')
               and (as_timestamp(now()) - as_timestamp(states.binary_sensor.alfen_headroom_critical.last_changed))
                   > states('input_number.alfen_critical_timeout') | float(60) }}
          # Post-stop cooldown: has enough time passed since the last guard-triggered stop?
          stop_cooldown_ok: >
            {% set last = state_attr('input_datetime.alfen_last_guard_stop','timestamp') %}
            {% set cd = states('input_number.alfen_stop_cooldown') | float(3) * 60 %}
            {{ true if last is none
               else (now().timestamp() - (last | float(0))) > cd }}
          # Safe target: clamp headroom to [min, max], rounded.
          safe: "{{ [ [ head | float, minc | float ] | max, maxc | float ] | min | round(0) }}"
          # Asymmetric deadband: going DOWN triggers car re-negotiation (expensive),
          # going UP doesn't. So only trim down for significant, sustained changes.
          buf_down: "{{ states('input_number.alfen_step_down_buffer') | float(1) }}"
          buf_up: "{{ states('input_number.alfen_step_up_buffer') | float(2) }}"
          # Scale-down settle: has the trim condition been true long enough?
          # Uses binary_sensor.alfen_guard_should_trim whose last_changed only
          # resets when the CONDITION crosses (not on every headroom update).
          down_settled: >
            {% set settle = states('input_number.alfen_guard_down_settle') | float(40) %}
            {{ is_state('binary_sensor.alfen_guard_should_trim','on')
               and (as_timestamp(now()) - as_timestamp(states.binary_sensor.alfen_guard_should_trim.last_changed))
                   >= settle }}
          # Scale-up settle: has headroom been sustainably above recovery threshold?
          up_settled: >
            {% set settle = states('input_number.alfen_guard_up_settle') | float(60) %}
            {{ is_state('binary_sensor.alfen_guard_can_recover','on')
               and (as_timestamp(now()) - as_timestamp(states.binary_sensor.alfen_guard_can_recover.last_changed))
                   >= settle }}
      - choose:
          # 0) No meter data for 30 s -> the fuse can't be protected, so hold the
          #    car at minimum current until the meter is back. Safe fallback
          #    instead of silently doing nothing.
          - conditions:
              - condition: template
                value_template: "{{ meter_missing and charging and (cur | float) > (minc | float) }}"
            sequence:
              - service: logbook.log
                data:
                  name: Alfen fuse guard
                  entity_id: input_boolean.alfen_events
                  message: >-
                    No meter data for 30 s — can't check the fuse, so holding at
                    {{ minc | float(0) | round(0) | int }} A until the meter is back. Check the
                    meter settings on the dashboard. Was at {{ cur | float(0) | round(0) | int }} A.
              - service: script.alfen_set_current
                data:
                  amps: "{{ minc }}"

          # 1) Sustained critical headroom — real overload, stop.
          - conditions:
              - condition: template
                value_template: "{{ meter_ok and charging and critical_sustained }}"
            sequence:
              - service: logbook.log
                data:
                  name: Alfen fuse guard
                  entity_id: input_boolean.alfen_events
                  message: >-
                    STOP — headroom {{ head }} A stayed under the {{ minc | float(0) | round(0) | int }} A
                    floor for {{ states('input_number.alfen_critical_timeout') | float(0) | round(0) | int }} s
                    (sustained overload, not a cloud). Was charging at {{ cur | float(0) | round(0) | int }} A.
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.alfen_last_guard_stop
                data:
                  timestamp: "{{ now().timestamp() }}"

          # 2) Headroom below current, sustained for settle time — trim down.
          #    Cloud = clamp to 6A floor, not stop.
          - conditions:
              - condition: template
                # ...and only if that actually lowers the current. Once at the
                # 6 A floor, repeating the same trim every tick would just be a
                # pointless write and a duplicate log line; branch 1 takes over.
                value_template: "{{ meter_ok and charging and down_settled and (safe | float) < (cur | float) }}"
            sequence:
              - service: logbook.log
                data:
                  name: Alfen fuse guard
                  entity_id: input_boolean.alfen_events
                  message: >-
                    Trim {{ cur | float(0) | round(0) | int }} A → {{ safe | float(0) | round(0) | int }} A — headroom
                    {{ head }} A on the tightest phase, low for at least the
                    {{ states('input_number.alfen_guard_down_settle') | float(0) | round(0) | int }} s
                    settle window (fuse budget
                    {{ states('input_number.alfen_fuse_per_phase') | float(0) | round(0) | int }} A/phase).
              - service: script.alfen_set_current
                data:
                  amps: "{{ safe }}"
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.alfen_last_guard_stop
                data:
                  timestamp: "{{ now().timestamp() }}"

          # 3) Fast recovery: headroom sustainably recovered (up-settle elapsed),
          #    AND stop cooldown elapsed. Going UP is free (no re-negotiation).
          - conditions:
              - condition: template
                value_template: >
                  {{ meter_ok and mode == 'Fast' and stop_cooldown_ok and up_settled
                     and head | float >= minc | float }}
            sequence:
              - service: logbook.log
                data:
                  name: Alfen fuse guard
                  entity_id: input_boolean.alfen_events
                  message: >-
                    Recover {{ cur | float(0) | round(0) | int }} A → {{ safe | float(0) | round(0) | int }} A — headroom
                    {{ head }} A, up-settle
                    ({{ states('input_number.alfen_guard_up_settle') | float(0) | round(0) | int }} s)
                    and cooldown
                    ({{ states('input_number.alfen_stop_cooldown') | float(0) | round(0) | int }} min)
                    both satisfied.
              - service: script.alfen_set_current
                data:
                  amps: "{{ safe }}"
        # Solar with headroom >= min: modulate loop handles it. Nothing to do.
        default: []

  # --- Mode routing: mode selection, HA start, or car plug-in (Mode 3 leaving A).
  #     Deliberately NOT triggered by any OTHER Mode 3 change. This automation
  #     calls alfen_switch_phases, which pauses the car for 10 s -- and that pause
  #     changes the Mode 3 state (C2 -> B1/B2). With a mode3 trigger plus
  #     mode: restart, that state change re-triggered this automation, which
  #     cancelled its own in-flight run. The script is called as a service, so it
  #     is a child of that run and died at the delay: register 1215 was never
  #     written and the charger stayed on 1 phase. Solar was unaffected because
  #     alfen_solar calls the same script and is not triggered by mode3.
  #     Disconnect handling now lives in its own automation below, which never
  #     switches phases and is therefore safe to restart.
  - id: alfen_charge_mode_apply
    alias: Alfen charge mode apply
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.alfen_charge_mode
      - trigger: homeassistant
        event: start
      # Car plugged in. The keep-alive stops while unplugged, so the charger's
      # setpoint has expired and it would otherwise start the car at its own
      # Safe current, whatever the selected mode, until the keep-alive's next
      # tick. This applies the mode immediately instead.
      # Safe with mode: restart: a phase switch moves Mode 3 between C and B,
      # never out of A, so this can't fire mid-switch and cancel the script.
      - trigger: state
        entity_id: sensor.alfen_mode3
        from: "A"
    actions:
      # On Home Assistant start: fill EMPTY meter fields with the HomeWizard P1
      # names, so a fresh install shows real names instead of "unknown". Fields
      # that already contain something are never touched, so your own names are
      # kept. (A fixed 'initial:' can't be used: it resets them on every restart.)
      # The logic itself has no fallback: it only ever uses what is in the field.
      - if:
          - condition: template
            value_template: "{{ trigger.platform == 'homeassistant' }}"
        then:
          - repeat:
              for_each:
                - { entity: input_text.alfen_meter_total, value: sensor.p1_meter_power }
                - { entity: input_text.alfen_meter_l1, value: sensor.p1_meter_power_phase_1 }
                - { entity: input_text.alfen_meter_l2, value: sensor.p1_meter_power_phase_2 }
                - { entity: input_text.alfen_meter_l3, value: sensor.p1_meter_power_phase_3 }
              sequence:
                - if:
                    - condition: template
                      value_template: >
                        {{ states(repeat.item.entity) | trim in ['', 'unknown', 'unavailable'] }}
                  then:
                    - service: input_text.set_value
                      target:
                        entity_id: "{{ repeat.item.entity }}"
                      data:
                        value: "{{ repeat.item.value }}"
      - choose:
          # Off, or no car / error state -> pause.
          - conditions:
              - condition: template
                value_template: >
                  {{ is_state('input_select.alfen_charge_mode','Off')
                     or states('sensor.alfen_mode3')
                        in ['A','E','F','unknown','unavailable'] }}
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"
          # Fast -> 3-phase at max, clamped by headroom. No trigger-source check
          # is needed any more: mode3 no longer triggers this automation, so it
          # can only run on a deliberate selection or on HA start.
          - conditions:
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Fast"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ states('sensor.alfen_phases') | int(1) != 3 }}"
                then:
                  - service: script.alfen_switch_phases
                    data:
                      phases: 3
              # With meter data: max current, limited by fuse room. Without it:
              # minimum current (the fuse can't be checked) -- except right after
              # a Home Assistant restart, when the meter may simply not have
              # loaded yet; then leave the current alone and let the fuse guard
              # decide once it has had 30 s.
              - if:
                  - condition: state
                    entity_id: binary_sensor.alfen_meter_ok
                    state: "on"
                then:
                  - service: script.alfen_set_current
                    data:
                      amps: >
                        {{ [ states('input_number.alfen_max_current') | float(16),
                             states('sensor.alfen_headroom_active') | float(99) ] | min }}
                else:
                  - if:
                      - condition: template
                        value_template: "{{ trigger.platform != 'homeassistant' }}"
                    then:
                      - service: script.alfen_set_current
                        data:
                          amps: "{{ states('input_number.alfen_min_current') | float(6) }}"
          # Solar -> hold the car paused until the Solar loop decides to start.
          # Only matters on plug-in (overrides the charger's Safe-current
          # fallback); on a mode selection the loop takes over within 20 s.
          - conditions:
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: template
                value_template: >
                  {{ states('input_number.alfen_target_current') | float(0)
                     < states('input_number.alfen_min_current') | float(6) }}
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"
        default: []

  # --- Car disconnected or faulted -> pause. Split out of the mode routing so
  #     that mode3 churn can restart THIS automation freely without ever being
  #     able to cancel a phase switch. It only writes stop current. ---
  - id: alfen_disconnect_pause
    alias: Alfen disconnect pause
    mode: single
    max_exceeded: silent
    # A (unplugged), E (no supply) or F (charger unavailable), held 10 s so a
    # single bad poll can't pause the car. A failed Modbus READ (unknown /
    # unavailable) is deliberately not a trigger: the charger keeps running on
    # its own setpoint, and a read glitch is not a disconnect.
    triggers:
      - trigger: state
        entity_id: sensor.alfen_mode3
        to: ["A", "E", "F"]
        for: "00:00:10"
    conditions:
      # Only act if we currently believe we are charging -- otherwise every
      # mode3 flicker on an empty charger would rewrite the setpoint.
      - condition: template
        value_template: >
          {{ states('input_number.alfen_target_current') | float(0)
             >= states('input_number.alfen_min_current') | float(6) }}
    actions:
      - service: logbook.log
        data:
          name: Alfen
          entity_id: input_boolean.alfen_events
          message: >-
            PAUSE — Mode 3 state is {{ states('sensor.alfen_mode3') }}
            (car disconnected or not supplying). Was at
            {{ states('input_number.alfen_target_current') | float(0) | round(0) | int }} A.
      - service: script.alfen_set_current
        data:
          amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"

  # --- Unified Solar control loop. Level-triggered on a /20s tick (+ mode change),
  #     so it re-checks conditions every tick and never misses a threshold-crossing
  #     edge. A choose runs at most ONE action per tick -> one write max -> no
  #     write-contention/flapping. Duration ("held N min") is measured from each
  #     surplus binary_sensor's last_changed. mode: single so a 15s phase switch
  #     completes before the next tick. ---
  - id: alfen_solar
    alias: Alfen solar control
    mode: single
    triggers:
      - trigger: time_pattern
        seconds: "/20"
      - trigger: state
        entity_id: input_select.alfen_charge_mode
        to: "Solar"
    conditions:
      - condition: state
        entity_id: input_select.alfen_charge_mode
        state: "Solar"
      - condition: template
        value_template: >
          {{ states('sensor.alfen_mode3')
             not in ['A','E','F','unknown','unavailable'] }}
      # Solar decisions need the meter. Without it the fuse guard holds the car
      # at minimum current and Solar leaves it alone until the meter is back.
      - condition: state
        entity_id: binary_sensor.alfen_meter_ok
        state: "on"
      # Same guard as the fuse guard above. This loop blocks itself while it
      # calls the switch script (mode: single), but a switch started elsewhere
      # -- the dashboard Force buttons, or charge_mode_apply -- would otherwise
      # let a modulate write land inside the pause window.
      - condition: state
        entity_id: script.alfen_switch_phases
        state: "off"
    actions:
      - variables:
          minc: "{{ states('input_number.alfen_min_current') | float(6) }}"
          head: "{{ states('sensor.alfen_headroom_active') | float(99) }}"
          cur: "{{ states('input_number.alfen_target_current') | float(0) }}"
          phases: "{{ states('sensor.alfen_phases') | int(1) }}"
          # Solar phases setting. ph_auto: the thresholds decide. target_ph: the
          # phase count Solar starts on (and, in a fixed mode, always uses).
          ph_auto: >
            {{ states('input_select.alfen_solar_phases') not in ['1-phase only','3-phase only'] }}
          target_ph: >
            {{ 3 if is_state('input_select.alfen_solar_phases','3-phase only') else 1 }}
          # Headroom on the phases Solar would START on: L1 for one phase, the
          # tightest of the three for three phases. (sensor.alfen_headroom_active
          # follows the CURRENT phase count, which may differ before a start.)
          start_head: >
            {% if is_state('input_select.alfen_solar_phases','3-phase only') %}
            {{ [ states('sensor.alfen_headroom_l1') | float(99),
                 states('sensor.alfen_headroom_l2') | float(99),
                 states('sensor.alfen_headroom_l3') | float(99) ] | min }}
            {% else %}
            {{ states('sensor.alfen_headroom_l1') | float(99) }}
            {% endif %}
          charging: >
            {{ states('input_number.alfen_target_current') | float(0)
               >= states('input_number.alfen_min_current') | float(6) }}
          # Durations: each flag is 'on' and has held for its hold window.
          start_held: >
            {{ is_state('binary_sensor.alfen_surplus_over_start','on')
               and (as_timestamp(now()) - as_timestamp(states.binary_sensor.alfen_surplus_over_start.last_changed))
                   >= states('input_number.alfen_solar_hold') | float(3) * 60 }}
          stop_held: >
            {{ is_state('binary_sensor.alfen_surplus_over_start','off')
               and (as_timestamp(now()) - as_timestamp(states.binary_sensor.alfen_surplus_over_start.last_changed))
                   >= states('input_number.alfen_solar_hold') | float(3) * 60 }}
          up_held: >
            {{ is_state('binary_sensor.alfen_surplus_over_up','on')
               and (as_timestamp(now()) - as_timestamp(states.binary_sensor.alfen_surplus_over_up.last_changed))
                   >= states('input_number.alfen_phase_hold') | float(3) * 60 }}
          down_held: >
            {{ is_state('binary_sensor.alfen_surplus_under_down','on')
               and (as_timestamp(now()) - as_timestamp(states.binary_sensor.alfen_surplus_under_down.last_changed))
                   >= states('input_number.alfen_phase_hold') | float(3) * 60 }}
          cooldown_ok: >
            {% set last = state_attr('input_datetime.alfen_last_phase_switch','timestamp') %}
            {% set cd = states('input_number.alfen_phase_cooldown') | float(12) * 60 %}
            {{ true if last is none
               else (now().timestamp() - (last | float(0))) > cd }}
          # Same cooldown the fuse guard uses before raising: after the guard has
          # lowered or stopped charging, Solar doesn't raise or restart either.
          stop_cooldown_ok: >
            {% set last = state_attr('input_datetime.alfen_last_guard_stop','timestamp') %}
            {% set cd = states('input_number.alfen_stop_cooldown') | float(3) * 60 %}
            {{ true if last is none
               else (now().timestamp() - (last | float(0))) > cd }}
          # RAISE toward the sun, but never into the last step-up-buffer amps of
          # fuse room -- the same margin the guard keeps before recovering.
          raise_to: >
            {% set room = (states('sensor.alfen_headroom_active') | float(99))
                          - (states('input_number.alfen_step_up_buffer') | float(2)) %}
            {{ [ states('sensor.alfen_solar_target') | float(0),
                 room | round(0, 'floor') ] | min }}
          # LOWER only once the sun has stayed lower for the slow-down wait.
          lower_settled: >
            {% set settle = states('input_number.alfen_solar_down_settle') | float(60) %}
            {{ is_state('binary_sensor.alfen_solar_should_lower','on')
               and (as_timestamp(now()) - as_timestamp(states.binary_sensor.alfen_solar_should_lower.last_changed))
                   >= settle }}
          # When lowering anyway, don't go above the fuse room either, so a sun
          # drop and a house load don't cost two separate restarts.
          lower_to: >
            {% set minc = states('input_number.alfen_min_current') | float(6) %}
            {% set head = states('sensor.alfen_headroom_active') | float(99) %}
            {{ [ [ states('sensor.alfen_solar_target') | float(0),
                   head | round(0, 'floor') ] | min, minc ] | max }}
      - choose:
          # 1) Not charging -> start, when EITHER surplus has held above the start
          #    threshold for the hold window, OR "keep charging at minimum" is on.
          #    Never start if the fuse can't fit minimum current (the guard would
          #    stop it again), nor within the guard's cooldown after it stepped in.
          #    Starts on 1 phase, or 3 when "3-phase only" is chosen.
          - conditions:
              - condition: template
                value_template: >
                  {{ not charging
                     and (start_held or is_state('input_boolean.alfen_solar_keep_min','on'))
                     and (start_head | float >= minc | float)
                     and stop_cooldown_ok }}
            sequence:
              - service: logbook.log
                data:
                  name: Alfen solar
                  entity_id: input_boolean.alfen_events
                  message: >-
                    {% if is_state('input_boolean.alfen_solar_keep_min','on') %}
                    Start at minimum — "keep charging at minimum" is on
                    (surplus {{ states('sensor.alfen_solar_surplus') | float(0) | round(0) | int }} W).
                    {% else %}
                    Start — surplus {{ states('sensor.alfen_solar_surplus') | float(0) | round(0) | int }} W
                    held above the start threshold for
                    {{ states('input_number.alfen_solar_hold') | float(0) | round(0) | int }} min.
                    {% endif %}
              - if:
                  - condition: template
                    value_template: "{{ phases | int != target_ph | int }}"
                then:
                  - service: script.alfen_switch_phases
                    data:
                      phases: "{{ target_ph | int }}"
                else:
                  - service: script.alfen_set_current
                    data:
                      amps: "{{ minc }}"

          # 2) Charging, but surplus has held below start for the hold window -> stop.
          #    Skipped entirely when "keep charging at minimum" is on: the car then
          #    stays at 6 A (modulation never goes below min) instead of pausing.
          #    Unless "3-phase only" is chosen, drop back to 1-phase so the next
          #    start doesn't need a phase switch.
          - conditions:
              - condition: template
                value_template: >
                  {{ charging and stop_held
                     and not is_state('input_boolean.alfen_solar_keep_min','on') }}
            sequence:
              - service: logbook.log
                data:
                  name: Alfen solar
                  entity_id: input_boolean.alfen_events
                  message: >-
                    Stop — surplus {{ states('sensor.alfen_solar_surplus') | float(0) | round(0) | int }} W
                    stayed below the start threshold for
                    {{ states('input_number.alfen_solar_hold') | float(0) | round(0) | int }} min.
                    {{ 'Resetting to 1-phase.' if (phases | int == 3 and target_ph | int == 1) else '' }}
              # Leave it on 3 phases when "3-phase only" is chosen, otherwise
              # the next start would need an extra phase switch.
              - if:
                  - condition: template
                    value_template: "{{ phases | int == 3 and target_ph | int == 1 }}"
                then:
                  - service: script.alfen_set_phases
                    data:
                      phases: 1
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"

          # (No fuse pause here. The fuse guard lowers, rides out and stops for the
          #  fuse in every mode, with its own buffers, settle times and timeout,
          #  so fuse behaviour is identical in Solar and Fast.)

          # 3b) Fixed phase mode, but charging on the other phase count (the
          #     setting was changed mid-charge, or a Force button was used) ->
          #     move to the chosen phases, respecting the phase cooldown.
          - conditions:
              - condition: template
                value_template: >
                  {{ charging and not ph_auto
                     and phases | int != target_ph | int and cooldown_ok }}
            sequence:
              - service: script.alfen_switch_phases
                data:
                  phases: "{{ target_ph | int }}"

          # 4) Auto only: charging on 1-phase, surplus held above up-threshold,
          #    cooldown ok -> 3-phase.
          - conditions:
              - condition: template
                value_template: "{{ charging and ph_auto and phases == 1 and up_held and cooldown_ok }}"
            sequence:
              - service: script.alfen_switch_phases
                data:
                  phases: 3

          # 5) Auto only: charging on 3-phase, surplus held below down-threshold,
          #    cooldown ok -> 1-phase.
          - conditions:
              - condition: template
                value_template: "{{ charging and ph_auto and phases == 3 and down_held and cooldown_ok }}"
            sequence:
              - service: script.alfen_switch_phases
                data:
                  phases: 1

          # 6) Follow the sun DOWN -- only after the slow-down wait, and only by
          #    at least the Solar step-down buffer (see alfen_solar_should_lower).
          #    Lowering makes many cars restart, so short clouds are ignored.
          #    Not logged: routine sun tracking would bury the real events.
          - conditions:
              - condition: template
                value_template: >
                  {{ charging and lower_settled
                     and (cur | float) - (lower_to | float) >= 1 }}
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ lower_to }}"

          # 7) Follow the sun UP -- raising causes no restart, so no wait, but
          #    never into the last step-up-buffer amps of fuse room, and not
          #    during the guard's cooldown after it stepped in. Not logged.
          - conditions:
              - condition: template
                value_template: >
                  {{ charging and stop_cooldown_ok
                     and (raise_to | float) - (cur | float) >= 1 }}
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ raise_to }}"
        default: []