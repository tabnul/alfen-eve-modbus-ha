# packages/alfen.yaml — generic control engine. No site-specific price wiring.

input_boolean:
  alfen_protect_lockout:
    name: Alfen protection lockout

input_number:
  alfen_target_current:
    name: Alfen target current
    min: 0
    max: 32
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_min_current:
    name: Alfen min current
    initial: 6
    min: 6
    max: 16
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_max_current:
    name: Alfen max current
    initial: 20
    min: 6
    max: 32
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_stop_current:
    name: Alfen stop current
    initial: 5
    min: 0
    max: 6
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_phase_limit:
    name: Alfen phase limit
    initial: 16
    min: 6
    max: 32
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_fuse_per_phase:
    name: Alfen fuse per phase
    initial: 25
    min: 6
    max: 80
    step: 1
    mode: box
    unit_of_measurement: A
  alfen_recovery_margin:
    name: Alfen recovery margin
    initial: 3
    min: 0
    max: 10
    step: 1
    mode: box
    unit_of_measurement: A

input_select:
  alfen_charge_mode:
    name: Alfen charge mode
    options:
      - "Off"
      - "Solar"
      - "Fast"
      - "Manual"
    initial: "Off"
  alfen_price_fallback:
    name: Alfen price fallback
    options:
      - "Off"
      - "Solar"
    initial: "Solar"

template:
  - sensor:
      - name: alfen_solar_surplus
        unique_id: alfen_solar_surplus
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {{ (states('sensor.alfen_power_sum') | float(0))
             - (states('sensor.p1_meter_power') | float(0)) }}

      - name: alfen_headroom_l1
        unique_id: alfen_headroom_l1
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set v = 230 %}
          {% set fuse = states('input_number.alfen_fuse_per_phase') | float(25) %}
          {% set car = states('sensor.alfen_current_l1') | float(0) %}
          {% set house = (states('sensor.p1_meter_power_phase_1') | float(0)) / v - car %}
          {{ (fuse - house) | round(1) }}
      - name: alfen_headroom_l2
        unique_id: alfen_headroom_l2
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set v = 230 %}
          {% set fuse = states('input_number.alfen_fuse_per_phase') | float(25) %}
          {% set car = states('sensor.alfen_current_l2') | float(0) %}
          {% set house = (states('sensor.p1_meter_power_phase_2') | float(0)) / v - car %}
          {{ (fuse - house) | round(1) }}
      - name: alfen_headroom_l3
        unique_id: alfen_headroom_l3
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set v = 230 %}
          {% set fuse = states('input_number.alfen_fuse_per_phase') | float(25) %}
          {% set car = states('sensor.alfen_current_l3') | float(0) %}
          {% set house = (states('sensor.p1_meter_power_phase_3') | float(0)) / v - car %}
          {{ (fuse - house) | round(1) }}

      - name: alfen_headroom_active
        unique_id: alfen_headroom_active
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set l1 = states('sensor.alfen_headroom_l1') | float(99) %}
          {% set l2 = states('sensor.alfen_headroom_l2') | float(99) %}
          {% set l3 = states('sensor.alfen_headroom_l3') | float(99) %}
          {% set ph = states('sensor.alfen_phases') | int(1) %}
          {% if ph == 3 %}
          {{ [ l1, l2, l3 ] | min | round(1) }}
          {% else %}
          {{ l1 | round(1) }}
          {% endif %}

script:
  alfen_set_current:
    fields:
      amps:
        description: Target current in Amps
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.alfen_target_current
        data:
          value: "{{ amps | float(0) }}"
      - variables:
          words: >
            {% set v = amps | float(0) %}
            {% if v <= 0 %}
            {{ [0, 0] }}
            {% else %}
            {% set ns = namespace(v=v, e=0) %}
            {% for _ in range(64) %}
            {% if ns.v >= 2 %}{% set ns.v = ns.v / 2 %}{% set ns.e = ns.e + 1 %}
            {% elif ns.v < 1 %}{% set ns.v = ns.v * 2 %}{% set ns.e = ns.e - 1 %}
            {% endif %}
            {% endfor %}
            {% set E = ns.e + 127 %}
            {% set M = ((ns.v - 1) * 8388608) | round | int %}
            {% set bits = E * 8388608 + M %}
            {{ [ bits // 65536, bits % 65536 ] }}
            {% endif %}
      - service: modbus.write_register
        data:
          hub: alfen
          slave: 1
          address: 1210
          value: "{{ words }}"

  alfen_set_phases:
    fields:
      phases:
        description: 1 or 3
    sequence:
      - service: modbus.write_register
        data:
          hub: alfen
          slave: 1
          address: 1215
          value: "{{ phases | int }}"

  alfen_switch_phases:
    fields:
      phases:
        description: 1 or 3
    mode: single
    sequence:
      - service: script.alfen_set_current
        data:
          amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"
      - delay: "00:00:10"
      - service: script.alfen_set_phases
        data:
          phases: "{{ phases }}"
      - delay: "00:00:05"
      - service: script.alfen_set_current
        data:
          amps: "{{ states('input_number.alfen_min_current') | float(6) }}"

automation:
  # --- Keep-alive: refresh 1210 every 30s while a car is connected ---
  - id: alfen_setpoint_renew
    alias: Alfen setpoint auto-renew
    mode: restart
    triggers:
      - trigger: time_pattern
        seconds: "/30"
    conditions:
      - condition: template
        value_template: >
          {{ states('sensor.alfen_mode3_state')
             not in ['A','E','F','unknown','unavailable'] }}
    actions:
      - service: script.alfen_set_current
        data:
          amps: "{{ states('input_number.alfen_target_current') | float(0) }}"

  # --- Always-on fuse protection: pause + latch lockout if ANY phase
  #     reaches the fuse rating, in ANY mode. ---
  - id: alfen_fuse_guard
    alias: Alfen fuse guard
    mode: restart
    trace:
      stored_traces: 50
    triggers:
      - trigger: time_pattern
        seconds: "/5"
    conditions:
      - condition: template
        value_template: >
          {{ states('sensor.alfen_mode3_state')
             not in ['A','E','F','unknown','unavailable'] }}
      - condition: template
        value_template: >
          {{ states('sensor.p1_meter_power_phase_1') not in ['unknown','unavailable']
             and states('sensor.p1_meter_power_phase_2') not in ['unknown','unavailable']
             and states('sensor.p1_meter_power_phase_3') not in ['unknown','unavailable'] }}
      - condition: template
        value_template: >
          {% set v = 230 %}
          {% set fuse = states('input_number.alfen_fuse_per_phase') | float(25) %}
          {% set l1 = (states('sensor.p1_meter_power_phase_1') | float(0)) / v %}
          {% set l2 = (states('sensor.p1_meter_power_phase_2') | float(0)) / v %}
          {% set l3 = (states('sensor.p1_meter_power_phase_3') | float(0)) / v %}
          {% set over = [l1, l2, l3] | max >= fuse %}
          {% set charging = states('input_number.alfen_target_current') | float(0)
                            >= states('input_number.alfen_min_current') | float(6) %}
          {{ over and charging }}
    actions:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.alfen_protect_lockout
      - service: script.alfen_set_current
        data:
          amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"

  # --- Protection lockout clear: only after headroom has been comfortably
  #     clear (min + recovery_margin) for 2 min, then kick-start Solar. ---
  - id: alfen_protect_clear
    alias: Alfen protection lockout clear
    mode: restart
    triggers:
      - trigger: template
        value_template: >
          {{ states('sensor.alfen_headroom_active') | float(0)
             >= states('input_number.alfen_min_current') | float(6)
              + states('input_number.alfen_recovery_margin') | float(3) }}
        for: "00:02:00"
    conditions:
      - condition: state
        entity_id: input_boolean.alfen_protect_lockout
        state: "on"
    actions:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.alfen_protect_lockout
      - condition: state
        entity_id: input_select.alfen_charge_mode
        state: "Solar"
      - condition: template
        value_template: >
          {{ states('sensor.alfen_mode3_state')
             not in ['A','E','F','unknown','unavailable'] }}
      - condition: template
        value_template: >
          {{ states('input_number.alfen_target_current') | float(0)
             < states('input_number.alfen_min_current') | float(6) }}
      - service: script.alfen_set_current
        data:
          amps: "{{ states('input_number.alfen_min_current') | float(6) }}"

  # --- Single control loop: all behaviour dispatched by trigger id ---
  - id: alfen_control
    alias: Alfen control
    mode: queued
    max: 10
    trace:
      stored_traces: 50
    triggers:
      - trigger: time_pattern
        seconds: "/15"
        id: tick
      - trigger: state
        entity_id: input_select.alfen_charge_mode
        id: mode_change
      - trigger: state
        entity_id: sensor.alfen_mode3_state
        id: mode_change
      - trigger: state
        entity_id: input_number.alfen_target_current
        id: manual_slider
      - trigger: template
        value_template: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             >= states('input_number.alfen_min_current') | float(6) * 230 }}
        for: "00:01:00"
        id: solar_start
      - trigger: template
        value_template: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             < states('input_number.alfen_min_current') | float(6) * 230 }}
        for: "00:02:00"
        id: solar_stop
      - trigger: template
        value_template: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             >= 3 * states('input_number.alfen_min_current') | float(6) * 230 }}
        for: "00:03:00"
        id: phase_up
      - trigger: template
        value_template: >
          {{ states('sensor.alfen_solar_surplus') | float(0)
             < 3 * states('input_number.alfen_min_current') | float(6) * 230 * 0.9 }}
        for: "00:03:00"
        id: phase_down
    actions:
      - choose:
          # ===== Mode / car-state change: Off|disconnect -> pause (+clear lockout); Fast -> 3p max =====
          - conditions:
              - condition: trigger
                id: mode_change
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >
                          {{ is_state('input_select.alfen_charge_mode','Off')
                             or states('sensor.alfen_mode3_state')
                                in ['A','E','F','unknown','unavailable'] }}
                    sequence:
                      - service: input_boolean.turn_off
                        target:
                          entity_id: input_boolean.alfen_protect_lockout
                      - service: script.alfen_set_current
                        data:
                          amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"
                  - conditions:
                      - condition: state
                        entity_id: input_select.alfen_charge_mode
                        state: "Fast"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states('sensor.alfen_phases') | int(1) != 3 }}"
                        then:
                          - service: script.alfen_switch_phases
                            data:
                              phases: 3
                      - service: script.alfen_set_current
                        data:
                          amps: >
                            {{ [ states('input_number.alfen_max_current') | float(20),
                                 states('input_number.alfen_phase_limit') | float(16),
                                 states('sensor.alfen_headroom_active') | float(99) ] | min }}
                default: []

          # ===== Manual slider write-through =====
          - conditions:
              - condition: trigger
                id: manual_slider
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Manual"
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_target_current') | float(0) }}"

          # ===== Solar start (kickstart to min; blocked while locked out) =====
          - conditions:
              - condition: trigger
                id: solar_start
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: state
                entity_id: input_boolean.alfen_protect_lockout
                state: "off"
              - condition: template
                value_template: >
                  {{ states('sensor.alfen_mode3_state')
                     not in ['A','E','F','unknown','unavailable'] }}
              - condition: template
                value_template: >
                  {{ states('input_number.alfen_target_current') | float(0)
                     < states('input_number.alfen_min_current') | float(6) }}
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_min_current') | float(6) }}"

          # ===== Solar stop =====
          - conditions:
              - condition: trigger
                id: solar_stop
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: template
                value_template: >
                  {{ states('input_number.alfen_target_current') | float(0)
                     >= states('input_number.alfen_min_current') | float(6) }}
            sequence:
              - service: script.alfen_set_current
                data:
                  amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"

          # ===== Solar modulate (15s tick, grid-zero feedback + fuse cutout) =====
          - conditions:
              - condition: trigger
                id: tick
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: template
                value_template: >
                  {{ states('sensor.alfen_mode3_state')
                     not in ['A','E','F','unknown','unavailable'] }}
              - condition: template
                value_template: >
                  {{ states('input_number.alfen_target_current') | float(0)
                     >= states('input_number.alfen_min_current') | float(6) }}
            sequence:
              - variables:
                  minc: "{{ states('input_number.alfen_min_current') | float(6) }}"
                  head: "{{ states('sensor.alfen_headroom_active') | float(99) }}"
                  newt: >
                    {% set surplus = states('sensor.alfen_solar_surplus') | float(0) %}
                    {% set ph = states('sensor.alfen_phases') | int(1) %}
                    {% set ph = ph if ph in [1,3] else 1 %}
                    {% set v = 230 %}
                    {% set minc = states('input_number.alfen_min_current') | float(6) %}
                    {% set maxc = states('input_number.alfen_max_current') | float(20) %}
                    {% set plim = states('input_number.alfen_phase_limit') | float(16) %}
                    {% set head = states('sensor.alfen_headroom_active') | float(99) %}
                    {% set raw = surplus / (ph * v) %}
                    {% set capped = [ raw, maxc, plim, head ] | min %}
                    {{ ([ capped, minc ] | max) | round(0) }}
              - choose:
                  # Headroom below the charge floor -> latch lockout + stop.
                  - conditions:
                      - condition: template
                        value_template: "{{ head | float < minc | float }}"
                    sequence:
                      - service: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.alfen_protect_lockout
                      - service: script.alfen_set_current
                        data:
                          amps: "{{ states('input_number.alfen_stop_current') | float(5) }}"
                default:
                  - condition: template
                    value_template: >
                      {{ (newt | float - states('input_number.alfen_target_current') | float(0))
                         | abs >= 1 }}
                  - service: script.alfen_set_current
                    data:
                      amps: "{{ newt }}"

          # ===== Phase up 1 -> 3 =====
          - conditions:
              - condition: trigger
                id: phase_up
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: template
                value_template: "{{ states('sensor.alfen_phases') | int(1) == 1 }}"
              - condition: template
                value_template: >
                  {{ states('input_number.alfen_target_current') | float(0)
                     >= states('input_number.alfen_min_current') | float(6) }}
            sequence:
              - service: script.alfen_switch_phases
                data:
                  phases: 3

          # ===== Phase down 3 -> 1 (only if L1 can hold a 1-phase charge) =====
          - conditions:
              - condition: trigger
                id: phase_down
              - condition: state
                entity_id: input_select.alfen_charge_mode
                state: "Solar"
              - condition: template
                value_template: "{{ states('sensor.alfen_phases') | int(1) == 3 }}"
              - condition: template
                value_template: >
                  {% set v = 230 %}
                  {% set fuse = states('input_number.alfen_fuse_per_phase') | float(25) %}
                  {% set minc = states('input_number.alfen_min_current') | float(6) %}
                  {% set ph = states('sensor.alfen_phases') | int(3) %}
                  {% set amps = states('input_number.alfen_target_current') | float(0) %}
                  {% set car_l1_now = (amps / 3) if ph == 3 else amps %}
                  {% set house_l1 = (states('sensor.p1_meter_power_phase_1') | float(0)) / v - car_l1_now %}
                  {{ (house_l1 + minc) <= fuse }}
            sequence:
              - service: script.alfen_switch_phases
                data:
                  phases: 1
        default: []