# =====================================================================
#  ALFEN EVE PRO - DASHBOARD  (sections view)
#  Paste the whole `views:` block into a dashboard's raw config editor,
#  or include as a YAML-mode dashboard. Requires the apexcharts-card
#  HACS resource for the chart.
# =====================================================================

views:
  - title: EV Charger
    path: ev-charger
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Control
        cards:
          - type: tile
            entity: input_select.alfen_charge_mode
            name: Mode
          - type: entities
            title: Limits
            entities:
              - entity: input_number.alfen_target_current
                name: ▸ Commanded current (live)
                secondary_info: last-updated
              - entity: input_number.alfen_max_current
                name: Max current — suggest 16
              - entity: input_number.alfen_min_current
                name: Min current — suggest 6
              - entity: input_number.alfen_stop_current
                name: Stop current — suggest 5
              - entity: input_number.alfen_fuse_per_phase
                name: Fuse per phase — suggest 24
              - entity: input_select.alfen_price_fallback
                name: Price fallback
          - type: entities
            title: Solar phase tuning
            entities:
              - entity: input_number.alfen_phase_up_threshold
                name: ▲ Phase up at — suggest 4800
              - entity: input_number.alfen_phase_down_threshold
                name: ▼ Phase down at — suggest 4140
              - entity: input_number.alfen_phase_cooldown
                name: Phase switch cooldown — suggest 12
              - entity: input_number.alfen_solar_hold
                name: Start/stop hold — suggest 3
              - entity: input_number.alfen_phase_hold
                name: Phase switch hold — suggest 3
              - entity: input_datetime.alfen_last_phase_switch
                name: Last phase switch
          - type: button
            name: Force 1-phase
            icon: mdi:numeric-1-circle-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.alfen_switch_phases
              data:
                phases: 1
          - type: button
            name: Force 3-phase
            icon: mdi:numeric-3-circle-outline
            show_state: false
            tap_action:
              action: perform-action
              perform_action: script.alfen_switch_phases
              data:
                phases: 3

      - type: grid
        title: Status
        cards:
          - type: tile
            entity: sensor.alfen_mode3_text
            name: EV status
          - type: tile
            entity: sensor.alfen_mode3_state
            name: Mode 3 (raw)
          - type: tile
            entity: sensor.alfen_phases
            name: Phases
          - type: tile
            entity: sensor.alfen_actual_applied_max_current
            name: Applied current
          - type: tile
            entity: sensor.alfen_setpoint_readback
            name: Setpoint
          - type: tile
            entity: sensor.alfen_setpoint_valid_time
            name: Setpoint valid
          - type: tile
            entity: sensor.alfen_setpoint_accounted_for
            name: Accounted for
          - type: tile
            entity: sensor.alfen_availability
            name: Availability
          - type: tile
            entity: sensor.alfen_temperature
            name: Temperature

      - type: grid
        title: Live power
        cards:
          - type: tile
            entity: sensor.alfen_solar_surplus
            name: Solar surplus
          - type: tile
            entity: sensor.alfen_power_sum
            name: Charger power
          - type: tile
            entity: sensor.p1_meter_power
            name: Grid power
          - type: tile
            entity: sensor.p1_meter_power_phase_1
            name: Grid L1
          - type: tile
            entity: sensor.p1_meter_power_phase_2
            name: Grid L2
          - type: tile
            entity: sensor.p1_meter_power_phase_3
            name: Grid L3
          - type: entities
            title: Fuse headroom (A the car may still draw)
            entities:
              - entity: sensor.alfen_headroom_active
                name: Active headroom (governs charging)
              - entity: sensor.alfen_headroom_l1
                name: Headroom L1
              - entity: sensor.alfen_headroom_l2
                name: Headroom L2
              - entity: sensor.alfen_headroom_l3
                name: Headroom L3
              - entity: input_number.alfen_fuse_per_phase
                name: Fuse per phase (total cap)
          - type: custom:apexcharts-card
            grid_options:
              columns: full
            header:
              show: true
              title: Charger power & surplus
            graph_span: 6h
            series:
              - entity: sensor.alfen_power_sum
                name: Charger
                stroke_width: 2
              - entity: sensor.alfen_solar_surplus
                name: Surplus
                stroke_width: 2

      - type: grid
        title: Meter
        cards:
          - type: entities
            title: Currents
            entities:
              - sensor.alfen_current_l1
              - sensor.alfen_current_l2
              - sensor.alfen_current_l3
          - type: entities
            title: Voltages
            entities:
              - sensor.alfen_voltage_l1n
              - sensor.alfen_voltage_l2n
              - sensor.alfen_voltage_l3n
          - type: entities
            title: Energy & quality
            entities:
              - entity: sensor.alfen_energy_consumed_total_kwh
                name: Energy consumed (total)
              - sensor.alfen_frequency
              - sensor.alfen_pf_sum
          - type: entities
            title: Device
            entities:
              - sensor.alfen_name
              - sensor.alfen_firmware_version
              - sensor.alfen_platform_type
              - sensor.alfen_station_serial
              - sensor.alfen_station_active_max_current
              - sensor.alfen_uptime

      - type: grid
        title: Help & explanation
        cards:
          - type: markdown
            content: >
              ## Modes


              **Off** — pauses the car.


              **Solar** — charges from solar surplus only. Starts on 1-phase,
              switches up to 3-phase when there is enough sustained surplus, and
              modulates the current to track the sun. Pauses when surplus runs out.


              **Fast** — 3-phase at maximum current (clamped by the phase and fuse
              limits). Ignores surplus — will import from grid. If a phase nears
              the fuse limit it trims the current down, then recovers back to max
              when the load clears.
          - type: markdown
            content: >
          - type: markdown
            content: >
              ## Solar tuning


              **Phase up at (W)** — surplus needed, held for the *phase switch
              hold*, before switching 1 → 3 phase. Higher = stays on 1-phase
              longer, switches up only with comfortable margin. Default 4800 W.


              **Phase down at (W)** — when surplus drops below this (held for the
              *phase switch hold*), it switches 3 → 1 phase. Default 4140 W
              (the 3-phase minimum, 3 × 6 A).


              **Phase switch cooldown** — minimum time between *any* two phase
              switches, in either direction. This is the main anti-thrash guard:
              even if surplus wobbles across the thresholds, it can't switch more
              than once per this window. Default 12 min.


              **Start/stop hold** — how long surplus must stay above (to start) or
              below (to stop) the 1-phase minimum before Solar acts. Prevents
              flapping on passing clouds. Default 3 min.


              **Phase switch hold** — how long the surplus condition must persist
              before a 1 ↔ 3 phase switch. Separate from start/stop so phase
              changes (which briefly pause charging) can be made more
              conservative. Default 3 min.


              *Note: after changing a hold value, reload automations for it to take
              effect. Thresholds and cooldown apply immediately.*
          - type: markdown
            content: >
              ## Limits


              **Max current** — the car's charge-rate ceiling per phase (the car's
              own max, default 16 A).


              **Min current** — the 6 A IEC floor; charging never runs below this.


              **Stop current** — the value written to pause the car (below 6 A).


              **Fuse per phase** — the TOTAL per-phase current cap (car + all other
              household devices). The fuse guard reads each phase's total from the
              P1 meter and trims the car's current to keep every phase under this,
              recovering when load clears. Set it just below your real fuse rating
              (e.g. 24 A under a 25 A fuse). Only pauses if even 6 A won't fit.